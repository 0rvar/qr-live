[package]
name = "qr-live"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.80"
prettydiff = "0.6.4"
serde = { version = "1.0.197", features = ["derive"] }
serde_derive = "1.0.197"
serde_json = "1.0.114"
serde_yaml = "0.9.32"
sha1 = "0.10.6"
tempfile = "3.10.1"
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "fs", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = "0.3"
clap = { version = "4.6", features = ["derive"] }
